# Point de départ GPU / Colab : augmenter d'abord le corpus, surveiller mémoire et validation.
seed: 0
device: auto
data: {corpus: data/raw/corpus.txt, tokenizer: data/tokenizer/tokenizer.json, train_tokens: data/processed/train.bin, val_tokens: data/processed/val.bin, val_fraction: 0.1}
model: {block_size: 128, n_layer: 6, n_head: 8, n_embd: 256, attn_type: gqa, n_kv_head: 4, position_mode: rope, norm_type: rmsnorm, ffn_type: swiglu, dropout: 0.1}
training: {steps: 3000, batch_size: 32, grad_accum: 2, lr: 0.0006, weight_decay: 0.1, optimizer: adamw, schedule: wsd, warmup_steps: 100, grad_clip: 1.0, dtype: bfloat16, eval_interval: 200, eval_iters: 20, checkpoint: checkpoints/small.pt}
